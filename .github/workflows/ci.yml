name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Node quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build contracts
        run: npm --workspace @matchcorner/contracts run build

      - name: Generate Prisma client
        run: npm --workspace @matchcorner/api run prisma:generate
        env:
          # Schema requires the name; generate does not connect to Postgres.
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build web
        run: npm --workspace @matchcorner/web run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid

  flutter:
    name: Flutter quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Compile debug APK
        run: >
          flutter build apk --debug
          --dart-define=API_BASE_URL=https://api.example.invalid
